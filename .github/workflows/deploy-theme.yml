name: Deploy Ghost Theme

# What ships is dist/theme, not the repository.
#
# The repository is a workspace — demo content, notes, a component lab, the
# design-system skill. scripts/build-dist.mjs assembles the theme out of it:
# templates minified, the built CSS and JS, package.json without its authoring
# fields. That step is pure Node with no dependencies, because CSS and JS are
# compiled from the Creator Design System — a local dependency that exists on
# one laptop — and are therefore committed under assets/built/.
#
# So: run `npm run build` locally and commit assets/built/ whenever you change
# anything under assets/css/, assets/js/ or the design system itself.

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail early if the built CSS is missing
        run: |
          test -s assets/built/screen.css || {
            echo "assets/built/screen.css is missing or empty."
            echo "Run 'npm run build' locally and commit assets/built/."
            exit 1
          }

      # Assembles dist/theme: the templates minified, the built CSS and JS, and
      # nothing else. Pure Node, no install — the artefacts are committed.
      - name: Build the shippable theme
        run: node scripts/build-dist.mjs

      - name: Validate theme (gscan)
        run: npx --yes gscan@5 dist/theme --fatal

      - name: Deploy to Ghost
        uses: TryGhost/action-deploy-theme@v1
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          working-directory: dist/theme
