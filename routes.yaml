# =============================================================================
# routes.yaml · Swarnil
# Upload in Ghost Admin → Settings → Labs → Routes.
#
# HOW THIS FILE IS ORGANISED
#
# Every collection here is one of two shapes:
#
#   FLAT       one tag, one level.        #video   → /videos/{slug}/
#   CONTAINER  a landing post plus its    #course  → /courses/{slug}/
#              children, nested under it. #lesson  → /courses/{course}/{slug}/
#
# A container's children are a separate collection whose permalink starts with
# the parent's path and uses {primary_tag}. That is why a child's FIRST tag must
# be the container's PUBLIC tag — Ghost builds the URL from it.
#
# ORDER MATTERS. Children are declared before their parent, because Ghost takes
# the first collection whose permalink matches and the child's is the deeper of
# the two. Moving a child below its parent silently 404s every child post.
#
# Two more rules Ghost enforces:
#   · every custom route needs a trailing slash
#   · collections are exclusive — a post belongs to the first one that claims
#     it, which is why /archive/ (no filter) sits last
# =============================================================================

routes:
  /:
    template: home
  /signin/:
    template: signin
  /signup/:
    template: signup
  /tags/:
    template: tags

collections:
  # ── Containers ─────────────────────────────────────────────────────────────
  # Child first, parent second. Every pair follows the same shape.

  # Guides · #guide-content → #guide
  /guide-steps/:
    permalink: /guide/{primary_tag}/{slug}/
    filter: tag:hash-guide-content
    order: published_at asc
    template: guide-steps

  /guide/:
    permalink: /guide/{slug}/
    filter: tag:hash-guide
    template: guide

  # Courses · #lesson → #course
  /lessons-index/:
    permalink: /courses/{primary_tag}/{slug}/
    filter: tag:hash-lesson
    template: lessons

  /courses/:
    permalink: /courses/{slug}/
    filter: tag:hash-course
    template: courses

  # Web series · #episode → #webseries
  /episodes-index/:
    permalink: /webseries/{primary_tag}/{slug}/
    filter: tag:hash-episode
    order: published_at asc
    template: episodes

  /webseries/:
    permalink: /webseries/{slug}/
    filter: tag:hash-webseries
    template: webseries

  # Projects · #project-detail (the build log) → #project
  /project-steps-index/:
    permalink: /projects/{primary_tag}/{slug}/
    filter: tag:hash-project-detail
    order: published_at asc
    template: project-details

  /projects/:
    permalink: /projects/{slug}/
    filter: tag:hash-project
    template: projects

  # Travel · #travel (a story) → #trip
  # Countries, cities and kinds ride along as internal tags on both —
  # #country-austria, #city-vienna, #travel-category-city — and never appear in
  # a URL. /travel/ reads them to build its filters.
  /travel-index/:
    permalink: /travel/{primary_tag}/{slug}/
    filter: tag:hash-travel
    order: published_at asc
    template: travels

  /travel/:
    permalink: /travel/{slug}/
    filter: tag:hash-trip
    template: travel

  # ── Flat collections ───────────────────────────────────────────────────────

  /videos/:
    permalink: /videos/{slug}/
    filter: tag:hash-video
    template: videos

  /blog/:
    permalink: /blog/{slug}/
    filter: tag:hash-blog
    template: blog

  /products/:
    permalink: /products/{slug}/
    filter: tag:hash-product
    template: products

  /shop/:
    permalink: /shop/{slug}/
    filter: tag:hash-shop
    template: shop

  /timeline/:
    permalink: /timeline/{slug}/
    filter: tag:hash-timeline
    order: published_at desc
    template: timeline

  /changelog/:
    permalink: /changelog/{slug}/
    filter: tag:hash-changelog
    template: changelog

  /newsletters/:
    permalink: /newsletters/{slug}/
    filter: tag:hash-newsletter
    template: newsletters

  /prompts/:
    permalink: /prompts/{slug}/
    filter: tag:hash-prompt
    template: prompts

  /snippets/:
    permalink: /snippets/{slug}/
    filter: tag:hash-snippet
    template: snippets

  # Life moments — a photograph and what happened.
  /experiences/:
    permalink: /experiences/{slug}/
    filter: tag:hash-experience
    template: experiences

  # This theme's own documentation, grouped by its #docs-* section tags.
  /docs/:
    permalink: /docs/{slug}/
    filter: tag:hash-docs
    order: published_at asc
    template: docs

  # ── Everything else ────────────────────────────────────────────────────────
  # No filter, so it claims whatever the collections above did not. Must stay
  # last: a collection declared after this one would never see a post.
  /archive/:
    permalink: /archive/{slug}/
    template: archive

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
